# fly.toml app configuration file generated for lovefamily on 2026-11-20T17:03:22Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'lovefamily'
primary_region = 'nrt'

[build]
[env]
  COOKIE_SECURE = '1'
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'lovefamily_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
