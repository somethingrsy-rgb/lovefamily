# Fly.io 배포 설정 (SQLite 단일 서버 + 영구 볼륨). app 이름은 소문자·숫자·하이픈만 가능하며 전 세계에서 유일해야 해요.
app = "lovefamily"
primary_region = "nrt"   # 도쿄(한국에서 가장 가까움)

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"

[[mounts]]
  source = "lovefamily_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # 타이머·알림이 항상 동작하도록 서버를 끄지 않고, SQLite 라서 한 대만 둡니다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
